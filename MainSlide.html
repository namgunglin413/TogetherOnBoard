        /* main Styles */

        body {
            background: #000000;
            font-family: "Roboto", sans-serif;
            font-size: 14px;
            margin: 0;
            position: fixed;
        }

        a { text-decoration: none; }

            width: 1000px;
            margin: auto;
        }

        h1 { text-align:center; margin-top:150px;}

        /* Navigation Styles */

        nav { background: #000000; }

        nav ul {
            font-size: 0;
            margin: 0;
            padding: 0;
        }

        nav ul li {
            display: inline-block;
            position: relative;
        }

        nav ul li a {
            color: #ffffff;
            display: block;
            font-size: 14px;
            padding: 15px 14px;
            transition: 0.3s linear;
        }

        nav ul li:hover { background: #fed151; }

        nav ul li ul {
            border-bottom: 5px solid #000000;
            display: none;
            position: absolute;
            width: 250px;
        }

        nav ul li ul li {
            border-top: 1px solid #444;
            display: block;
        }

        nav ul li ul li:first-child { border-top: none; }

        nav ul li ul li a {
            background: #000000;
            display: block;
            padding: 10px 14px;
        }

        nav ul li ul li a:hover { background: #897335;}

        nav .fa.fa-angle-down { margin-left: 6px; }

        .image-wrapper {
            position: absolute;
            top: 40%;
            left: 20%;
            width: 30%;
            height: auto;
        }

        .third.page {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; /* Viewport height */
        }

        .Dice1 {
            width: 10%;
            height: auto;
            position: absolute;
            top: 20%;
            left: 80%;
            animation: ani 0.4s infinite alternate;
            filter: drop-shadow(1px 15px 3px #121212);
            transform: scaleX(1); /* 원래 모습 */
        }
        .Dice2 {
            width: 10%;
            height: auto;
            position: absolute;
            top: 40%;
            left:50%;
            animation: ani 0.29s infinite alternate;
            transform: scaleX(-1); /*좌우반전 코드라는데 안먹힘...*/
        }
        @keyframes ani {
            0% {transform: translate(0, 0);}
            100% {transform: translate(0, 90px);}
        }

<script>
    document.addEventListener("DOMContentLoaded", function() {
    const slider = document.querySelector('.slides');
    let currentIndex = 0;
    const slideCount = slider.children.length;
    const slideWidth = 400; // 슬라이더의 너비를 맞춰주세요.
    const slideInterval = 3000; // 3초 간격으로 설정

    setInterval(function() {
        currentIndex = (currentIndex + 1) % slideCount;
        slider.style.transform = `translateX(-${currentIndex * slideWidth}px)`;
    }, slideInterval);
});

     <script>
    document.addEventListener("DOMContentLoaded", function() {
    const radios = document.querySelectorAll("input[type='radio']");
    let currentIndex = 0;
    let intervalId;

    function checkNext() {
        radios[currentIndex].checked = true;
        currentIndex = (currentIndex + 1) % radios.length;
    }

    function startAutoCheck(index) {
        clearInterval(intervalId);
        currentIndex = index;
        intervalId = setInterval(checkNext, 2000); // 2초마다 다음 라디오 버튼을 선택합니다.
    }

    radios.forEach((radio, index) => {
        radio.addEventListener("click", () => {
            startAutoCheck(index);
        });
    });

    intervalId = setInterval(checkNext, 2000); // 페이지 로드 시 자동 시작
});


     </script>
