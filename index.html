    <style>
        @import url(https://fonts.googleapis.com/css?family=Roboto:400,700,500);

        /* 기본 스타일 */
        html { box-sizing: border-box; }

        *, *:before, *:after { box-sizing: inherit; }

        body {
            background: #000000;
            font-family: "Roboto", sans-serif;
            font-size: 15px;
            margin: 0;
            padding: 0;
            overflow: hidden; /* 스크롤 숨기기 */
        }

        a { text-decoration: none; }

        h1 { text-align: center; margin-top: 150px; }

        /* 네비게이션 스타일 */
        header {
            width: 100%;
            position: fixed;
            top: 0;
            z-index: 1000; /* 네비게이션 바를 다른 콘텐츠 위로 */
        }

        nav {
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 60px; /* 필요한 경우 높이 조정 */
        }

        nav ul {
            font-size: 0;
            margin: 0;
            padding: 0;
            list-style: none;
            display: flex;
            justify-content: center; /* 메뉴 항목을 가로로 가운데 정렬 */
            align-items: center; /* 메뉴 항목을 세로로 가운데 정렬 */
        }

        nav ul li {
            display: inline-block;
            position: relative;
        }
        
        nav ul li a {
            color: #ffffff;
            display: block;
            font-size: 20px;
            padding: 15px 52px;
            transition: 0.3s linear;
        }

        nav ul li a img {
            height: 30px; 
            width: 50px;
            vertical-align: middle; 
        }

        nav ul li:hover > a { 
            background: #ffd700; 
            color: #000000; 
        }

        nav ul li ul {
            border-bottom: 5px solid #000000;
            display: none;
            position: absolute;
            width: 250px;
            z-index: 2000; /* 드롭다운 리스트를 위로 올림 */
        }

        nav ul li ul li {
            border-top: 1px solid #444;
            display: block;
        }

        nav ul li ul li:first-child { border-top: none; }

        nav ul li ul li a {
            background: #000000;
            display: block;
            padding: 10px 14px;
        }

        nav ul li ul li a:hover { background: #000000; }

        nav .fa.fa-angle-down { margin-left: 6px; }

        /* 인라인 프레임 스타일 */
        .content {
            position: absolute;
            top: 60px; /* 네비게이션 바 높이 */
            width: 100%;
            height: calc(100% - 60px); /* 네비게이션 바를 뺀 전체 높이 */
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>

<script>
    $(document).ready(function(){
        // 마우스를 올렸을 때 드롭다운 메뉴 표시
        $('nav ul li').hover(
            function() {
                $(this).find('ul').stop().slideDown(200);
            },
            function() {
                $(this).find('ul').stop().slideUp(200);
            }
        );
    });
</script>
