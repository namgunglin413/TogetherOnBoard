  <div class="btn-top"><a href="#">Top</a></div><!-- 탑버튼 -->
  <script>
    const searchInput = document.getElementById('search-input');
    const boardgameItems = document.querySelectorAll('.boardgame-item');

    searchInput.addEventListener('input', function() {
      const searchTerm = this.value.toLowerCase();

      boardgameItems.forEach(function(item) {
        const gameTitle = item.querySelector('h3').textContent.toLowerCase();

        if (gameTitle.includes(searchTerm)) {
          item.style.display = 'block';
        }
        else {
          item.style.display = 'none';
        }
      });
    });
  </script>

var btnTop = doc.querySelector('.btn-top');
