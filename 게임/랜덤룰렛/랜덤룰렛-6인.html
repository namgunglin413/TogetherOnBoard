<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
      <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>6인룰렛</title>
  <style>
    html,body { margin: 0; padding: 0; height: 100%; }
    .section { width: 70%; height: 100%; float: left; }
    .aside { width:30%; height:100%; float: left; }
    
    @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css");

    * {
    font-family: Pretendard;
    }
    
    body {
        background-image: url("랜덤게임배경.png");
        background-size: cover;
}
    canvas {
        transition: 2s;
        pointer-events: none;
        margin-top: 5%;
        margin-left: 310%;
        width: 140%;
        height: 140%;
    }
    button {
        background: #febf00;
        margin-top: 1rem;
        margin-left: 310%;
        padding: 0.8rem 1.8rem;
        border: none;
        font-size: 1.5rem;
        font-weight: bold;
        border-radius: 5px;
        transition: .2s;
        cursor: pointer;
        width: 200px;
        height: 60px;
    }
    button:active {
        background: #444;
        color: #f9f9f9;
    }    
    #div {
        width: 380px;
        display: flex;
        align-items: center;
        flex-direction: column;
        position: relative;
    }
    #div::before {
        content: "";
        position: absolute;
        width: 10px;
        height: 50px;
        border-radius: 5px;
        background: #000;
        top: -10px;
        margin-left: 312.5%;
        transform: translateX(-50%);
        z-index: 22;
    }
    .land-filter {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      margin-right: 7%;
    }
    .land-filter button {
      padding: 10px;
      border: 2px solid #ccc;
      border-radius: 20px;
      margin-left: 5px;
      width: 350px;
      margin-top: 10%;
    }
    .btn:hover {
      background-color: #808080;
    }
    </style>
</head>
<body>
    <section class="section">
<div id="div">    
  <canvas width="380" height='380'></canvas>  
  <button onclick="rotate()">P U S H !</button>
</div>
</section>
<aside class="aside">
<div class="land-filter">
    <a href="랜덤룰렛-2인.html">
        <button class="btn">2-3인</button></a>
    <a href="랜덤룰렛-4인.html">
        <button class="btn">4-5인</button></a>
    <a href="랜덤룰렛-6인.html">
        <button class="btn">6인 이상</button></a>
</div>
</aside>
<script>
    const $c = document.querySelector("canvas");
    const ctx = $c.getContext(`2d`);

    const product = [ "스컬", '텔레스트 레이션', "달무티", "카탄의 개척자", "노 땡스", "셀레스티아", "딕싯", "우노", "블리츠"];

    const colors = [ "#dc0936", "#e6471d", "#f7a416", "#efe61f ", "#60b236", "#209b6c", "#169ed8", "#3f297e", "#87207b", "#be107f", "#e7167b"];

    const newMake = () => {
        const [cw, ch] = [$c.width / 2, $c.height / 2];
        const arc = Math.PI / (product.length / 2);
    
        for (let i = 0; i < product.length; i++) {
            ctx.beginPath();
            ctx.fillStyle = colors[i % (colors.length -1)];
            ctx.moveTo(cw, ch);
            ctx.arc(cw, ch, cw, arc * (i - 1), arc * i);
            ctx.fill();
            ctx.closePath();
        }

        ctx.fillStyle = "#fff";
        ctx.font = "18px Pretendard";
        ctx.textAlign = "center";

        for (let i = 0; i < product.length; i++) {
        const angle = (arc * i) + (arc / 2);

        ctx.save()  ;

        ctx.translate(
            cw + Math.cos(angle) * (cw - 50),
            ch + Math.sin(angle) * (ch - 50),
        );

        ctx.rotate(angle + Math.PI / 2);

        product[i].split(" ").forEach((text, j) => {
            ctx.fillText(text, 0, 30 * j);
        });

        ctx.restore();
        }
    }

    const rotate = () => {
        $c.style.transform = `initial`;
        $c.style.transition = `initial`;
    
        setTimeout(() => {
            const ran = Math.floor(Math.random() * product.length);

            const arc = 360 / product.length;
            const rotate = (ran * arc) + 3600 + (arc * 3) - (arc/4);
        
            $c.style.transform = `rotate(-${rotate}deg)`;
            $c.style.transition = `2s`;
        
            setTimeout(() => alert(`6인 추천 보드게임은 ${product[ran]} 입니다 :)`), 2000);
        }, 1);
    };
    newMake();
</script>
</body>
</html>
