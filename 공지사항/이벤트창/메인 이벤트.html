<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EVENT</title>
  <style>
    h1 {
      text-align: center;
    }
    a {
      text-decoration: none; /* 밑줄 제거 */
      color: black; /* 글자 색상 검정색으로 변경 */
    }
    .event-list {
      display: grid; /* CSS Grid 사용 */
      grid-template-columns: repeat(auto-fill, minmax(30%, 1fr)); /* 각 아이템이 30% 너비를 가지도록 설정 */
      gap: 3%; /* 아이템 사이 간격 설정 */
      padding: 3%;
    }
    .event-item {
      aspect-ratio: 1 / 1; /* 1:1 비율 유지 */
      position: relative; /* 이미지 비율 유지를 위해 필요한 속성 */
      text-align: center; /* 아이템 내부 텍스트 정렬 (가운데 정렬) */
      overflow: hidden; /* 이미지가 아이템을 넘지 않도록 설정 */
    }
    .event-item img {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: 100%;
      object-fit: cover; /* 이미지가 컨테이너를 덮도록 설정 */
      transform: translate(-50%, -50%); /* 이미지를 중앙에 위치 */
    }
    .event-item h3 {
      margin-top: 10px; /* 제목 상단 여백 */
      position: absolute;
      bottom: 10px;
      left: 0;
      width: 100%;
      text-align: center;
      background-color: rgba(255, 255, 255, 0.8); /* 배경색 추가로 텍스트 가독성 향상 */
    }
  </style>
</head>
<body>
  <h1>EVENT</h1>
  <div class="event-list">   
    <div class="event-item">
      <a href="2024 새해 이벤트.html">
      <img src="이벤트/2024 새해 이벤트.png" alt="2024 새해 이벤트"></a>
    </div>
    <div class="event-item">
      <a href="2023 연말 감사 이벤트.html">
      <img src="이벤트/2023 연말 감사 이벤트.png" alt="2023 연말 감사 이벤트"></a>
    </div>
    <div class="event-item">
      <a href="2023 블랙프라이데이 이벤트.html">
      <img src="이벤트/2023 블랙프라이데이 이벤트.png" alt="2023 블랙프라이데이 이벤트"></a>
    </div>
    <div class="event-item">
      <a href="2023 할로윈 이벤트.html">
      <img src="이벤트/2023 할로윈 이벤트.png" alt="2023 할로윈 이벤트"></a>
    </div>
    <div class="event-item">
      <a href="2023 추석맞이 이벤트.html">
      <img src="이벤트/2023 추석맞이 이벤트.png" alt="2023 추석맞이 이벤트"></a>
    </div>
    <div class="event-item">
      <a href="2023 여름방학 이벤트.html">
      <img src="이벤트/2023 여름방학 이벤트.png" alt="2023 여름방학 이벤트"></a>
    </div>
    <div class="event-item">
      <a href="2023 어린이날 이벤트.html">
      <img src="이벤트/2023 어린이날 이벤트.png" alt="2023 어린이날 이벤트"></a>
    </div>
    <div class="event-item">
      <a href="2023 봄맞이 이벤트.html">
      <img src="이벤트/2023 봄맞이 이벤트.png" alt="2023 봄맞이 이벤트"></a>
    </div>

</body>
</html>
