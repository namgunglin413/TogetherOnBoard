<!DOCTYPE html>
<html>
<head>
    <title>test_평점</title>
    <link rel="stylesheet" type="text/css" href="body.css">     <!-- css 및 별모양 불러오기-->
    <!-- Add your other CSS links here -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
</head>

<body>
<div class="wrapper">
    <input type="radio" name="rate" id="star1">         <!-- 라디오 타입으로 별점 매김-->
    <input type="radio" name="rate" id="star2">
    <input type="radio" name="rate" id="star3">
    <input type="radio" name="rate" id="star4"> 
    <input type="radio" name="rate" id="star5"> 
    <div class="content">
        <div class="outer">
            <div class="emojis">
                <li class="slide"><span>😡</span></li>           <!-- 점수별 표정 움직임 -->
                <li><span>😟</span></li>
                <li><span>😐</span></li>
                <li><span>😃</span></li>
                <li><span>🤩</span></li>
            </div>
        </div>
        <div class="stars">
            <label for="star1" class="star1 fa fa-star"></label>    <!--각 별 라벨 지정-->
            <label for="star2" class="star2 fa fa-star"></label>
            <label for="star3" class="star3 fa fa-star"></label>
            <label for="star4" class="star4 fa fa-star"></label>
            <label for="star5" class="star5 fa fa-star"></label>
        </div>
    </div>
    <div class="footer">
        <span class="text"></span>
        <span class="numb"></span>

        <div class="input-wrapper">
            <input class="input" type="text" placeholder="리뷰 입력">
        </div>

        <button class="btn" onclick="addPost()">제출</button>
        <ul id="reviewList"></ul>
    </div>
</div>

<script>
    function addPost() {
        var input = document.querySelector('.input').value;
        var reviewList = document.getElementById('reviewList');
        var li = document.createElement('li');
        var text = document.createTextNode(input);
        li.appendChild(text);
        reviewList.appendChild(li);

        // Save reviews to local storage
        saveReviews();

        // Reset input field
        document.querySelector('.input').value = "";
    }

    function saveReviews() {
        var reviews = document.getElementById("reviewList").innerHTML;
        localStorage.setItem("reviews", reviews);
    }
</script>

</body>
</html>
